<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KDCanvas Analytics</title>
    <style>
        :root {
            --bg-base: #0a0a0c;
            --bg-panel: #111115;
            --border-color: #2a2a30;
            --text-main: #f0e6d2;
            --text-muted: #888890;
            --accent-gold: #c8aa6e;
            --win-green: #00cca3;
            --loss-red: #e25c5c;
            --btn-hover: #1e2328;
        }

        body { background-color: var(--bg-base); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; box-sizing: border-box; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #33333b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #44444f; }

        .navbar { display: flex; align-items: center; justify-content: space-between; padding: 15px 30px; background: #0a0a0c; border-bottom: 1px solid var(--border-color); flex-shrink: 0; z-index: 10; }
        .logo-container { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo-container img { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--accent-gold); }
        .logo-container span { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }

        .nav-search { display: none; align-items: center; background: #18181c; border-radius: 20px; border: 1px solid #333; overflow: hidden; }
        .nav-search input { background: transparent; border: none; color: var(--text-main); padding: 8px 15px; font-size: 13px; outline: none; width: 140px; }
        .nav-search input:first-child { border-right: 1px solid #333; }
        .nav-search button { background: #222; border: none; color: var(--accent-gold); padding: 8px 15px; font-weight: bold; cursor: pointer; }
        .nav-search button:hover { background: var(--accent-gold); color: #000; }

        .hero-section { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; overflow: hidden; background: #0a0a0c; }
        .hero-video { position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%; width: auto; height: auto; transform: translateX(-50%) translateY(-50%); z-index: 0; opacity: 0.25; object-fit: cover; }
        .hero-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
        
        .hero-title { font-size: 42px; font-weight: 800; margin-bottom: 30px; text-align: center; line-height: 1.1; }
        .hero-title span { color: var(--accent-gold); }
        .hero-search-wrapper { display: flex; background: #18181c; border: 1px solid #333; border-radius: 30px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 600px; }
        .hero-search-wrapper input { flex: 1; background: transparent; border: none; color: var(--text-main); padding: 18px 25px; font-size: 16px; outline: none; }
        .hero-search-wrapper input:first-child { flex: 1.5; border-right: 1px solid #333; }
        .hero-search-wrapper button { background: #222; border: none; color: var(--accent-gold); padding: 0 35px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .hero-search-wrapper button:hover:not(:disabled) { background: var(--accent-gold); color: #000; }

        #status { text-align: center; color: var(--text-muted); font-size: 13px; margin-top: 20px; height: 16px; }

        .dashboard { display: none; grid-template-columns: 280px 1fr 600px; gap: 20px; width: 100%; max-width: 1700px; margin: 0 auto; padding: 20px; flex-grow: 1; min-height: 0; box-sizing: border-box; }
        
        .panel { background: var(--bg-panel); border: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; border-radius: 8px; }
        .panel-header { background: #16161a; padding: 12px 15px; font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
        .panel-content { padding: 10px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 8px; }

        .match-item { background: #18181c; padding: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; border-radius: 6px; }
        .match-meta { display: flex; justify-content: space-between; font-size: 11px; border-bottom: 1px solid #25252b; padding-bottom: 6px; font-weight: bold; }
        .match-info { display: flex; align-items: center; gap: 12px; }
        .match-info img { width: 36px; height: 36px; border-radius: 50%; }
        .match-kda { font-size: 13px; font-weight: 600; }
        .btn-view { padding: 6px; font-size: 11px; width: 100%; background: #222; border: 1px solid #333; color: var(--text-muted); border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-view:hover:not(:disabled) { background: #333; color: var(--text-main); }

        .center-col { display: flex; flex-direction: column; gap: 15px; overflow-y: auto; padding-right: 5px; align-items: center; }
        #mapCanvas { background-color: #0d1a24; border: 1px solid var(--border-color); border-radius: 8px; background-image: url('opgg_map.png'); background-size: cover; width: 500px; height: 500px; flex-shrink: 0; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 650px; }
        .stat-card { background: #18181c; border: 1px solid var(--border-color); padding: 10px; display: flex; align-items: center; gap: 10px; border-radius: 6px; }
        .stat-card img { width: 34px; height: 34px; border-radius: 4px; }
        .stat-card-circle img { border-radius: 50%; }
        .stat-info { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
        .stat-title { font-size: 9px; color: var(--text-muted); text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
        .stat-name { font-size: 11px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stat-val { font-size: 11px; font-weight: bold; }

        .teams-wrapper { display: flex; gap: 10px; height: 100%; }
        .team-col { display: flex; flex-direction: column; gap: 6px; width: 100%; }
        .player-card { background: #18181c; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; display: flex; flex-direction: column; gap: 6px; }
        .player-header { display: flex; align-items: center; gap: 10px; }
        .player-header img { width: 28px; height: 28px; border-radius: 50%; }
        .player-name { font-size: 11px; font-weight: bold; width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-casts { font-size: 10px; color: var(--text-muted); border-top: 1px solid #25252b; padding-top: 6px; display: flex; justify-content: space-between; }
        .player-toggles { display: flex; gap: 15px; font-size: 10px; margin-top: 2px; }
        .player-toggles label { cursor: pointer; display: flex; align-items: center; gap: 4px; font-weight: bold; }
        
        .blue-team { border-left: 3px solid #00aaff; }
        .red-team { border-left: 3px solid #cc0000; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo-container" onclick="resetToHome()">
        <img src="emily.png" alt="Logo">
        <span>KDCanvas</span>
    </div>
    <div class="nav-search" id="navSearch">
        <input type="text" id="navGameName" placeholder="Game Name">
        <input type="text" id="navTagLine" placeholder="Tagline">
        <button onclick="triggerSearch(true)">GO!</button>
    </div>
</nav>

<div class="hero-section" id="heroSection">
    <video autoplay loop muted playsinline class="hero-video">
        <!-- Add your cinematic video file to the root directory and uncomment below -->
        <!-- <source src="your_video.mp4" type="video/mp4"> -->
    </video>
    <div class="hero-content">
        <div class="hero-title">Uncover your League performance</div>
        <div class="hero-search-wrapper">
            <input type="text" id="heroGameName" placeholder="Game Name">
            <input type="text" id="heroTagLine" placeholder="# Tagline">
            <button onclick="triggerSearch(false)">GO!</button>
        </div>
        <div id="status"></div>
    </div>
</div>

<div class="dashboard" id="dashboardSection">
    <div class="panel">
        <div class="panel-header">Match History</div>
        <div class="panel-content" id="matchList"></div>
    </div>
    
    <div class="center-col">
        <canvas id="mapCanvas" width="500" height="500"></canvas>
        <div class="stats-grid" id="statsGrid"></div>
    </div>
    
    <div class="panel">
        <div class="panel-header" id="detailHeader">Live Match Data</div>
        <div class="panel-content" id="playerList">
            <div style="color: var(--text-muted); text-align: center; font-size: 13px; margin-top: 20px;">Select a match to load telemetry</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    const RIOT_MAP_MAX = 15000; 
    const TARGET_MATCH_COUNT = 50;
    const VALID_QUEUES = [400, 420, 430, 440, 490, 700];

    let matchIdsList = [];
    let matchData = {}; 
    let validMatchCount = 0;
    let currentPuuid = '';
    let activeDetailedMatchId = null;
    let playerHeatmapToggles = {}; 
    let queueActive = false;
    let currentRenderId = 0;

    let champMap = {};
    let itemMap = {};
    let perkMap = {};
    let imageCache = {};

    function resetToHome() {
        queueActive = false;
        document.getElementById('heroSection').style.display = 'flex';
        document.getElementById('navSearch').style.display = 'none';
        document.getElementById('dashboardSection').style.display = 'none';
        document.getElementById('status').innerText = '';
    }

    async function loadStaticAssets() {
        try {
            const cRes = await fetch('https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/champions.json');
            const cData = await cRes.json();
            cData.forEach(c => { if (c.id) champMap[c.id] = c.name; });

            const iRes = await fetch('https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/items.json');
            const iData = await iRes.json();
            iData.forEach(i => {
                if (i.id) itemMap[i.id] = { name: i.name, price: i.priceTotal, icon: parseCDragonPath(i.iconPath) };
            });

            const pRes = await fetch('https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/perks.json');
            const pData = await pRes.json();
            pData.forEach(p => {
                if (p.id) perkMap[p.id] = { name: p.name, icon: parseCDragonPath(p.iconPath) };
            });
        } catch (e) { console.error("Asset load failure", e); }
    }

    function parseCDragonPath(path) {
        if (!path) return '';
        let p = path.toLowerCase();
        if (p.includes('/assets/items/')) {
            return `https://raw.communitydragon.org/latest/game${p.substring(p.indexOf('/assets/items/'))}`;
        } else if (p.includes('/v1/perk-images/')) {
            return `https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default${p.substring(p.indexOf('/v1/perk-images/'))}`;
        }
        return '';
    }

    function triggerSearch(fromNav) {
        let gName = fromNav ? document.getElementById('navGameName').value : document.getElementById('heroGameName').value;
        let tLine = fromNav ? document.getElementById('navTagLine').value : document.getElementById('heroTagLine').value;
        
        if (!gName || !tLine) return;

        document.getElementById('heroSection').style.display = 'none';
        document.getElementById('navSearch').style.display = 'flex';
        document.getElementById('dashboardSection').style.display = 'grid';
        
        document.getElementById('navGameName').value = gName;
        document.getElementById('navTagLine').value = tLine;

        executePipeline(gName, tLine);
    }

    async function executePipeline(gameName, tagLine) {
        const status = document.getElementById('status');
        
        if (Object.keys(itemMap).length === 0) {
            document.getElementById('detailHeader').innerText = "Syncing CDN Assets...";
            await loadStaticAssets();
            document.getElementById('detailHeader').innerText = "Live Match Data";
        }

        queueActive = false;
        matchData = {};
        matchIdsList = [];
        validMatchCount = 0;
        activeDetailedMatchId = null;
        
        document.getElementById('matchList').innerHTML = '';
        document.getElementById('statsGrid').innerHTML = '';
        document.getElementById('playerList').innerHTML = '<div style="color: var(--text-muted); text-align: center; font-size: 13px; margin-top: 20px;">Caching matches...</div>';
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        try {
            const accountRes = await fetch(`/api/account/${gameName}/${tagLine}`);
            const accountData = await accountRes.json();
            if (!accountData.puuid) throw new Error("Account resolution failed.");
            currentPuuid = accountData.puuid;

            const matchRes = await fetch(`/api/matches/${currentPuuid}`);
            matchIdsList = await matchRes.json();

            queueActive = true;
            processQueue(0);
        } catch (error) { 
            document.getElementById('playerList').innerHTML = `<div style="color: var(--loss-red); text-align: center; font-size: 13px; margin-top: 20px;">${error.message}</div>`;
        }
    }

    async function processQueue(index) {
        if (!queueActive || validMatchCount >= TARGET_MATCH_COUNT || index >= matchIdsList.length) {
            if (queueActive) compileAdvancedStats();
            return;
        }

        const matchId = matchIdsList[index];
        
        try {
            const detailsRes = await fetch(`/api/match/${matchId}`);
            const details = await detailsRes.json();
            
            if (!VALID_QUEUES.includes(details.info.queueId)) {
                setTimeout(() => processQueue(index + 1), 50);
                return;
            }

            matchData[matchId] = { kills: [], deaths: [], participants: details.info.participants, playerEvents: {} };
            const timelineRes = await fetch(`/api/timeline/${matchId}`);
            const timeline = await timelineRes.json();

            for (let pId = 1; pId <= 10; pId++) {
                matchData[matchId].playerEvents[pId] = { kills: [], deaths: [] };
            }

            timeline.info.frames.forEach(frame => {
                frame.events.forEach(event => {
                    if (event.type === 'CHAMPION_KILL' && event.position) {
                        if (event.killerId && matchData[matchId].playerEvents[event.killerId]) {
                            matchData[matchId].playerEvents[event.killerId].kills.push(event); 
                        }
                        if (event.victimId && matchData[matchId].playerEvents[event.victimId]) {
                            matchData[matchId].playerEvents[event.victimId].deaths.push(event); 
                        }
                    }
                });
            });

            validMatchCount++;
            appendMatchCard(matchId, details);
            compileAdvancedStats();

        } catch (e) {
            console.error(`Discard index ${index}:`, e);
        }

        setTimeout(() => processQueue(index + 1), 250);
    }

    function appendMatchCard(matchId, details) {
        const pStats = details.info.participants.find(p => p.puuid === currentPuuid);
        if (!pStats) return;

        const isWin = pStats.win;
        const colorHtml = isWin ? `color: var(--win-green);` : `color: var(--loss-red);`;
        const textHtml = isWin ? 'WIN' : 'LOSS';
        
        const iconUrl = `https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/champion-icons/${pStats.championId}.png`;
        const divKda = Math.max(1, pStats.deaths);
        const rawKda = (pStats.kills + pStats.assists) / divKda;
        
        let kColor = 'var(--text-muted)';
        if (pStats.deaths > 0) {
            if (rawKda >= 4) kColor = 'var(--accent-gold)';
            else if (rawKda >= 3) kColor = 'var(--win-green)';
            else if (rawKda >= 2) kColor = '#e29b3f';
            else kColor = 'var(--loss-red)';
        } else if (pStats.kills + pStats.assists > 0) kColor = 'var(--accent-gold)';

        const div = document.createElement('div');
        div.className = 'match-item';
        div.innerHTML = `
            <div class="match-meta">
                <span style="color: var(--text-muted);">Match ${validMatchCount}</span>
                <span style="${colorHtml}">${textHtml}</span>
            </div>
            <div class="match-info">
                <img src="${iconUrl}">
                <div style="display:flex; flex-direction: column;">
                    <span class="match-kda">${pStats.kills} / ${pStats.deaths} / ${pStats.assists}</span>
                    <span style="font-size: 11px; color: ${kColor}; font-weight: bold;">${rawKda.toFixed(2)} KDA</span>
                </div>
            </div>
            <button class="btn-view" onclick="displayDetailedMatch('${matchId}')">View Data</button>
        `;
        document.getElementById('matchList').appendChild(div);
    }

    function compileAdvancedStats() {
        const oppStats = {};
        const itmStats = {};
        const rneStats = {};

        Object.values(matchData).forEach(match => {
            const me = match.participants.find(p => p.puuid === currentPuuid);
            if (!me) return;

            const myTeam = me.teamId;
            const won = me.win;

            match.participants.filter(p => p.teamId !== myTeam).forEach(opp => {
                const cId = opp.championId;
                if (!oppStats[cId]) oppStats[cId] = { wins: 0, games: 0, type: 'champ', id: cId };
                oppStats[cId].games++;
                if (won) oppStats[cId].wins++;
            });

            for(let i=0; i<6; i++) {
                const itemId = me[`item${i}`];
                if (itemId && itemMap[itemId] && itemMap[itemId].price >= 1500) {
                    if (!itmStats[itemId]) itmStats[itemId] = { wins: 0, games: 0, type: 'item', id: itemId };
                    itmStats[itemId].games++;
                    if (won) itmStats[itemId].wins++;
                }
            }

            if (me.perks && me.perks.styles && me.perks.styles[0].selections) {
                const perkId = me.perks.styles[0].selections[0].perk;
                if (perkId && perkMap[perkId]) {
                    if (!rneStats[perkId]) rneStats[perkId] = { wins: 0, games: 0, type: 'rune', id: perkId };
                    rneStats[perkId].games++;
                    if (won) rneStats[perkId].wins++;
                }
            }
        });

        const grid = document.getElementById('statsGrid');
        grid.innerHTML = '';

        grid.appendChild(buildStatBlock("Common Matchup", getStatFilter(oppStats, 'common', 1), '#fff', 'stat-card-circle'));
        grid.appendChild(buildStatBlock("Common Item", getStatFilter(itmStats, 'common', 1), '#fff'));
        grid.appendChild(buildStatBlock("Common Rune", getStatFilter(rneStats, 'common', 1), '#fff', 'stat-card-circle'));

        grid.appendChild(buildStatBlock("Best Matchup", getStatFilter(oppStats, 'best', 2), 'var(--win-green)', 'stat-card-circle'));
        grid.appendChild(buildStatBlock("Best Item", getStatFilter(itmStats, 'best', 2), 'var(--win-green)'));
        grid.appendChild(buildStatBlock("Best Rune", getStatFilter(rneStats, 'best', 2), 'var(--win-green)', 'stat-card-circle'));

        grid.appendChild(buildStatBlock("Worst Matchup", getStatFilter(oppStats, 'worst', 2), 'var(--loss-red)', 'stat-card-circle'));
        grid.appendChild(buildStatBlock("Worst Item", getStatFilter(itmStats, 'worst', 2), 'var(--loss-red)'));
        grid.appendChild(buildStatBlock("Worst Rune", getStatFilter(rneStats, 'worst', 2), 'var(--loss-red)', 'stat-card-circle'));
    }

    function getStatFilter(statMap, mode, minGames) {
        let arr = Object.values(statMap);
        if (arr.length === 0) return null;
        
        arr.forEach(i => i.rate = i.wins / i.games);
        let filtered = arr.filter(i => i.games >= minGames);
        if (filtered.length === 0) filtered = arr; 

        if (mode === 'common') filtered.sort((a, b) => b.games - a.games || b.rate - a.rate);
        else if (mode === 'best') filtered.sort((a, b) => b.rate - a.rate || b.games - a.games);
        else if (mode === 'worst') filtered.sort((a, b) => a.rate - b.rate || b.games - a.games);
        
        return filtered[0];
    }

    function buildStatBlock(title, dataObj, colorHex, extraClass = '') {
        const div = document.createElement('div');
        div.className = `stat-card ${extraClass}`;
        
        if (!dataObj) {
            div.innerHTML = `<div class="stat-info"><span class="stat-title">${title}</span><span class="stat-name" style="color:var(--text-muted)">N/A</span></div>`;
            return div;
        }

        let imgUrl = '';
        let name = '';
        if (dataObj.type === 'champ') {
            imgUrl = `https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/champion-icons/${dataObj.id}.png`;
            name = champMap[dataObj.id] || "Champion";
        } else if (dataObj.type === 'item') {
            imgUrl = itemMap[dataObj.id].icon;
            name = itemMap[dataObj.id].name;
        } else if (dataObj.type === 'rune') {
            imgUrl = perkMap[dataObj.id].icon;
            name = perkMap[dataObj.id].name;
        }

        const rate = (dataObj.rate * 100).toFixed(0);
        div.innerHTML = `
            <img src="${imgUrl}">
            <div class="stat-info">
                <span class="stat-title">${title}</span>
                <span class="stat-name" title="${name}">${name}</span>
                <span class="stat-val" style="color:${colorHex};">${rate}% <span style="color:var(--text-muted); font-size:9px; font-weight:normal;">(${dataObj.wins}W-${dataObj.games - dataObj.wins}L)</span></span>
            </div>
        `;
        return div;
    }

    function displayDetailedMatch(matchId) {
        activeDetailedMatchId = matchId;
        playerHeatmapToggles = {};
        
        const searchedPlayer = matchData[matchId].participants.find(p => p.puuid === currentPuuid);
        const searchedId = searchedPlayer ? searchedPlayer.participantId : null;
        
        for (let pId = 1; pId <= 10; pId++) {
            playerHeatmapToggles[pId] = { kills: pId === searchedId, deaths: pId === searchedId };
        }
        
        renderRightPanel(matchId);
        renderCanvas();
    }

    function renderRightPanel(matchId) {
        const listDiv = document.getElementById('playerList');
        listDiv.innerHTML = '<div class="teams-wrapper"><div class="team-col" id="colBlue"></div><div class="team-col" id="colRed"></div></div>';
        
        const participants = matchData[matchId].participants;
        
        participants.forEach(p => {
            const riotId = p.riotIdGameName ? `${p.riotIdGameName}#${p.riotIdTagline}` : p.summonerName;
            const iconUrl = `https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/champion-icons/${p.championId}.png`;
            
            const divKda = Math.max(1, p.deaths);
            const rawKda = (p.kills + p.assists) / divKda;
            
            const pId = p.participantId;
            const kChecked = playerHeatmapToggles[pId].kills ? 'checked' : '';
            const dChecked = playerHeatmapToggles[pId].deaths ? 'checked' : '';
            
            const teamClass = p.teamId === 100 ? 'blue-team' : 'red-team';
            const targetCol = p.teamId === 100 ? document.getElementById('colBlue') : document.getElementById('colRed');

            const card = document.createElement('div');
            card.className = `player-card ${teamClass}`;
            card.innerHTML = `
                <div class="player-header">
                    <img src="${iconUrl}">
                    <div class="player-info">
                        <span class="player-name" title="${riotId}">${riotId}</span>
                        <span style="color: var(--text-muted); font-size: 11px;">${p.kills}/${p.deaths}/${p.assists} <span style="font-weight:bold; color: #fff;">(${rawKda.toFixed(2)})</span></span>
                    </div>
                </div>
                <div class="player-casts">
                    <span>Q: ${p.spell1Casts||0}</span> <span>W: ${p.spell2Casts||0}</span> <span>E: ${p.spell3Casts||0}</span> <span>R: ${p.spell4Casts||0}</span>
                </div>
                <div class="player-toggles">
                    <label><input type="checkbox" ${kChecked} onchange="togglePlayerHeatmap(${pId}, 'kills', this.checked)"> K</label>
                    <label><input type="checkbox" ${dChecked} onchange="togglePlayerHeatmap(${pId}, 'deaths', this.checked)"> D</label>
                </div>
            `;
            targetCol.appendChild(card);
        });
    }

    function togglePlayerHeatmap(participantId, type, isChecked) {
        if (playerHeatmapToggles[participantId]) {
            playerHeatmapToggles[participantId][type] = isChecked;
            renderCanvas();
        }
    }

    function getChampionImage(champId) {
        return new Promise((resolve) => {
            if (imageCache[champId]) return resolve(imageCache[champId]);
            const img = new Image();
            img.src = `https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/champion-icons/${champId}.png`;
            img.onload = () => { imageCache[champId] = img; resolve(img); };
            img.onerror = () => resolve(null);
        });
    }

    async function renderCanvas() {
        currentRenderId++;
        const renderId = currentRenderId;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (!activeDetailedMatchId) return;
        const match = matchData[activeDetailedMatchId];
        
        const C_BLUE_KILL = 'rgba(0, 180, 255, 1.0)';
        const C_BLUE_DEATH = 'rgba(30, 80, 180, 1.0)';
        const C_RED_KILL = 'rgba(200, 20, 20, 1.0)';
        const C_RED_DEATH = 'rgba(120, 0, 0, 1.0)';

        for (const pId of Object.keys(playerHeatmapToggles)) {
            const toggles = playerHeatmapToggles[pId];
            const events = match.playerEvents[pId];
            const participant = match.participants.find(p => p.participantId == pId);
            
            if (!events || !participant || (!toggles.kills && !toggles.deaths)) continue;
            
            const isBlueTeam = participant.teamId === 100;
            const killBorder = isBlueTeam ? C_BLUE_KILL : C_RED_KILL;
            const deathBorder = isBlueTeam ? C_BLUE_DEATH : C_RED_DEATH;
            
            const img = await getChampionImage(participant.championId);
            if (renderId !== currentRenderId) return; 
            
            if (toggles.kills) {
                events.kills.forEach(event => drawIcon(event.position.x, event.position.y, img, killBorder));
            }
            if (toggles.deaths) {
                events.deaths.forEach(event => drawIcon(event.position.x, event.position.y, img, deathBorder));
            }
        }
    }

    function drawIcon(riotX, riotY, img, borderColor) {
        const pixelX = (riotX / RIOT_MAP_MAX) * canvas.width;
        const pixelY = canvas.height - ((riotY / RIOT_MAP_MAX) * canvas.height);
        const radius = 9;

        if (img) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(pixelX, pixelY, radius, 0, Math.PI * 2, true);
            ctx.closePath();
            ctx.clip();
            ctx.globalAlpha = 0.9; 
            ctx.drawImage(img, pixelX - radius, pixelY - radius, radius * 2, radius * 2);
            ctx.restore();
        }

        ctx.beginPath();
        ctx.arc(pixelX, pixelY, radius, 0, Math.PI * 2, true);
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }
</script>
