<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KDCanvas</title>
    <style>
        body { background-color: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .top-bar { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        input, button { padding: 8px; font-size: 14px; background: #333; color: white; border: 1px solid #555; }
        button { cursor: pointer; }
        button:hover:not(:disabled) { background: #555; }
        button:disabled { cursor: not-allowed; opacity: 0.5; }
        
        .main-content { display: flex; gap: 20px; width: 100%; max-width: 1400px; justify-content: center; align-items: flex-start; }
        .left-panel { display: flex; flex-direction: column; gap: 15px; width: 230px; }
        .sidebar { display: flex; flex-direction: column; gap: 10px; background: #222; padding: 15px; border: 2px solid #444; overflow-y: auto; max-height: 400px; box-sizing: border-box; }
        .stats-panel { background: #222; border: 2px solid #444; padding: 15px; box-sizing: border-box; }
        .stats-title { font-size: 12px; font-weight: bold; text-transform: uppercase; color: #e5c158; border-bottom: 1px solid #444; padding-bottom: 5px; margin-bottom: 8px; }
        
        .match-item { background: #333; padding: 10px; border: 1px solid #555; display: flex; flex-direction: column; gap: 6px; }
        .match-meta { display: flex; justify-content: space-between; font-size: 13px; align-items: center; border-bottom: 1px solid #444; padding-bottom: 4px; }
        .match-card-info { display: flex; align-items: center; gap: 8px; font-size: 11px; margin-top: 2px; }
        .match-card-info img { width: 22px; height: 22px; border-radius: 50%; border: 1px solid #555; }
        
        /* Side-by-Side Player Panel Layout */
        .player-list-container { display: flex; gap: 10px; width: 560px; min-height: 500px; }
        .team-container { display: flex; flex-direction: column; gap: 5px; width: 275px; border: 1px solid #444; border-radius: 4px; padding: 8px; box-sizing: border-box; }
        .team-blue { border-color: rgba(0, 100, 255, 0.5); background: rgba(0, 50, 150, 0.05); }
        .team-red { border-color: rgba(255, 0, 50, 0.5); background: rgba(150, 0, 30, 0.05); }
        .team-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #aaa; margin-bottom: 5px; font-weight: bold; }
        
        .player-card { display: flex; flex-direction: column; gap: 4px; background: #2a2a2a; padding: 8px; border: 1px solid #444; border-radius: 4px; }
        .player-header { display: flex; align-items: center; gap: 8px; }
        .player-header img { width: 28px; height: 28px; border-radius: 50%; }
        .player-info { display: flex; flex-direction: column; font-size: 12px; }
        .player-name { font-weight: bold; width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .player-kda { color: #aaa; }
        .player-decimal-kda { font-weight: bold; font-size: 11px; margin-left: 3px; }
        
        .player-casts { font-size: 10px; color: #bbb; border-top: 1px solid #3d3d3d; padding-top: 4px; display: flex; justify-content: space-between; }
        .player-toggles { display: flex; gap: 10px; font-size: 11px; margin-top: 2px; }
        .player-toggles label { cursor: pointer; display: flex; align-items: center; gap: 3px; }

        .stat-row { display: flex; align-items: center; gap: 10px; background: #333; padding: 6px; border: 1px solid #555; margin-bottom: 5px; font-size: 12px; }
        .stat-row img { width: 24px; height: 24px; border-radius: 50%; border: 1px solid #555; }

        #mapCanvas { 
            background-color: #0d1a24; 
            border: 2px solid #555; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            background-image: url('opgg_map.png');
            background-size: cover;
        }
        #status { margin-bottom: 20px; font-family: monospace; color: #aaa; text-align: center; }
    </style>
</head>
<body>

<div class="top-bar">
    <input type="text" id="gameName" placeholder="Game Name">
    <input type="text" id="tagLine" placeholder="Tagline">
    <button onclick="fetchData()">Generate Data</button>
</div>

<div id="status">Awaiting input...</div>

<div class="main-content">
    <div class="left-panel">
        <div class="sidebar" id="matchList"></div>
        <div class="stats-panel">
            <div class="stats-title">Highest Win Rate Against</div>
            <div id="winrateStats" style="color: #777; font-size: 12px; text-align: center;">Awaiting match history data...</div>
        </div>
    </div>
    
    <canvas id="mapCanvas" width="500" height="500"></canvas>
    
    <div class="player-list-container" id="playerList">
        <div style="color: #777; text-align: center; font-size: 13px; width: 100%; margin-top: 50px;">Select a match to load players and heatmap</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    const RIOT_MAP_MAX = 15000; 

    let matchIdsList = [];
    let matchData = {}; 
    let currentPuuid = '';
    let activeDetailedMatchId = null;
    let playerHeatmapToggles = {}; 
    let queueActive = false;

    async function fetchData() {
        const gameName = document.getElementById('gameName').value;
        const tagLine = document.getElementById('tagLine').value;
        const status = document.getElementById('status');
        const matchListDiv = document.getElementById('matchList');
        const playerListDiv = document.getElementById('playerList');
        const winrateStats = document.getElementById('winrateStats');

        if (!gameName || !tagLine) {
            status.innerText = "Error: Input required.";
            return;
        }

        queueActive = false;
        matchData = {};
        matchIdsList = [];
        activeDetailedMatchId = null;
        matchListDiv.innerHTML = '';
        playerListDiv.innerHTML = '<div style="color: #777; text-align: center; font-size: 13px; width: 100%; margin-top: 50px;">Select a match to load players and heatmap</div>';
        winrateStats.innerHTML = '<div style="color: #777; font-size: 12px; text-align: center;">Calculating stats...</div>';
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        try {
            status.innerText = "Fetching PUUID...";
            const accountRes = await fetch(`/api/account/${gameName}/${tagLine}`);
            const accountData = await accountRes.json();
            if (!accountData.puuid) throw new Error(`API Error: ${JSON.stringify(accountData)}`);
            currentPuuid = accountData.puuid;

            status.innerText = "Fetching Match List...";
            const matchRes = await fetch(`/api/matches/${currentPuuid}`);
            matchIdsList = await matchRes.json();

            status.innerText = "Match list compiled. Executing background queue...";
            
            for (let i = 0; i < matchIdsList.length; i++) {
                const matchId = matchIdsList[i];
                const div = document.createElement('div');
                div.className = 'match-item';
                div.id = `item-${matchId}`;
                div.innerHTML = `
                    <div class="match-meta">
                        <span>Match ${i + 1}</span>
                        <span id="badge-${matchId}" style="color: #aaa; font-size: 11px; font-weight: bold;">Loading...</span>
                    </div>
                    <div class="match-card-info" id="info-${matchId}">
                        <span style="color: #777;">Pending data...</span>
                    </div>
                    <button id="btn-${matchId}" disabled onclick="displayMatchData('${matchId}')" style="padding: 4px 8px; font-size: 11px; width: 100%;">View Match</button>
                `;
                matchListDiv.appendChild(div);
            }

            queueActive = true;
            processQueue(0);

        } catch (error) {
            status.innerText = "Execution failed: " + error.message;
        }
    }

    async function processQueue(index) {
        if (!queueActive || index >= matchIdsList.length) {
            if (queueActive) {
                document.getElementById('status').innerText = "All matches cached. Zero-latency navigation active.";
                calculateWinRates();
            }
            return;
        }

        const matchId = matchIdsList[index];
        const status = document.getElementById('status');
        
        try {
            status.innerText = `Caching match ${index + 1}/${matchIdsList.length} in background...`;
            
            matchData[matchId] = { kills: [], deaths: [], participants: [], playerEvents: {} };

            const detailsRes = await fetch(`/api/match/${matchId}`);
            const details = await detailsRes.json();
            matchData[matchId].participants = details.info.participants;

            const timelineRes = await fetch(`/api/timeline/${matchId}`);
            const timeline = await timelineRes.json();

            const participantInfo = timeline.info.participants.find(p => p.puuid === currentPuuid);
            if (!participantInfo) {
                throw new Error("Target player missing in match timeline.");
            }
            const participantId = participantInfo.participantId;

            for (let pId = 1; pId <= 10; pId++) {
                matchData[matchId].playerEvents[pId] = { kills: [], deaths: [] };
            }

            timeline.info.frames.forEach(frame => {
                frame.events.forEach(event => {
                    if (event.type === 'CHAMPION_KILL' && event.position) {
                        const kId = event.killerId;
                        const vId = event.victimId;
                        if (kId && matchData[matchId].playerEvents[kId]) {
                            // Store complete event object instead of coordinates
                            matchData[matchId].playerEvents[kId].kills.push(event); 
                        }
                        if (vId && matchData[matchId].playerEvents[vId]) {
                            matchData[matchId].playerEvents[vId].deaths.push(event); 
                        }
                    }
                });
            });

            const targetPlayerStats = details.info.participants.find(p => p.puuid === currentPuuid);
            const isWin = targetPlayerStats ? targetPlayerStats.win : false;
            
            const badge = document.getElementById(`badge-${matchId}`);
            if (badge) {
                badge.innerHTML = isWin 
                    ? '<span style="color: #57ca85;">WIN</span>' 
                    : '<span style="color: #e25c5c;">LOSS</span>';
            }

            const infoDiv = document.getElementById(`info-${matchId}`);
            if (infoDiv && targetPlayerStats) {
                const iconUrl = `https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/champion-icons/${targetPlayerStats.championId}.png`;
                const divisor = Math.max(1, targetPlayerStats.deaths);
                const rawKda = (targetPlayerStats.kills + targetPlayerStats.assists) / divisor;
                const decimalKda = rawKda.toFixed(2);

                let kdaColor = '#aaa';
                if (targetPlayerStats.deaths > 0) {
                    if (rawKda >= 4.0) kdaColor = '#e5c158'; 
                    else if (rawKda >= 3.0) kdaColor = '#57ca85'; 
                    else if (rawKda >= 2.0) kdaColor = '#e29b3f'; 
                    else kdaColor = '#e25c5c'; 
                } else if (targetPlayerStats.kills + targetPlayerStats.assists > 0) {
                    kdaColor = '#e5c158'; 
                }

                infoDiv.innerHTML = `
                    <img src="${iconUrl}" alt="Champ">
                    <span>
                        ${targetPlayerStats.kills}/${targetPlayerStats.deaths}/${targetPlayerStats.assists}
                        <span style="color: ${kdaColor}; font-weight: bold; margin-left: 3px;">(${decimalKda})</span>
                    </span>
                `;
            }

            const btn = document.getElementById(`btn-${matchId}`);
            if (btn) btn.disabled = false;

            // Compute statistics incrementally as data caches
            calculateWinRates();

        } catch (e) {
            const badge = document.getElementById(`badge-${matchId}`);
            if (badge) badge.innerHTML = '<span style="color: #999;">ERROR</span>';
            const infoDiv = document.getElementById(`info-${matchId}`);
            if (infoDiv) infoDiv.innerHTML = '<span style="color: #777;">Fetch failed</span>';
            console.error(`Queue failure on match index ${index}:`, e);
        }

        setTimeout(() => processQueue(index + 1), 500);
    }

    // Aggregated Opposing Match-Up Winrate Parser
    function calculateWinRates() {
        const opponentStats = {};

        Object.values(matchData).forEach(match => {
            if (!match.participants || match.participants.length === 0) return;

            const me = match.participants.find(p => p.puuid === currentPuuid);
            if (!me) return;

            const myTeam = me.teamId;
            const won = me.win;

            // Target the opposing team participants
            const opponents = match.participants.filter(p => p.teamId !== myTeam);

            opponents.forEach(opp => {
                const champId = opp.championId;
                if (!opponentStats[champId]) {
                    opponentStats[champId] = { wins: 0, games: 0 };
                }
                opponentStats[champId].games += 1;
                if (won) opponentStats[champId].wins += 1;
            });
        });

        // Map and sort results
        let list = Object.keys(opponentStats).map(champId => {
            const stats = opponentStats[champId];
            return {
                championId: champId,
                wins: stats.wins,
                games: stats.games,
                winrate: (stats.wins / stats.games) * 100
            };
        });

        // Filter out single matchups to prioritize recurring counter matchups
        let filtered = list.filter(item => item.games >= 2);
        if (filtered.length === 0) filtered = list; // Fallback if no champions are fought repeatedly

        filtered.sort((a, b) => b.winrate - a.winrate || b.games - a.games);

        const winrateStatsDiv = document.getElementById('winrateStats');
        if (filtered.length === 0) {
            winrateStatsDiv.innerHTML = '<div style="color: #777; text-align: center;">No opponent data compiled.</div>';
            return;
        }

        winrateStatsDiv.innerHTML = '';
        const displayLimit = Math.min(3, filtered.length);
        
        for (let i = 0; i < displayLimit; i++) {
            const item = filtered[i];
            const iconUrl = `https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/champion-icons/${item.championId}.png`;
            
            const row = document.createElement('div');
            row.className = 'stat-row';
            row.innerHTML = `
                <img src="${iconUrl}" alt="Champ">
                <div style="display: flex; flex-direction: column;">
                    <span style="font-weight: bold; color: #57ca85;">${item.winrate.toFixed(0)}% Win Rate</span>
                    <span style="color: #aaa; font-size: 10px;">Record: ${item.wins}W - ${item.games - item.wins}L</span>
                </div>
            `;
            winrateStatsDiv.appendChild(row);
        }
    }

    function displayMatchData(matchId) {
        activeDetailedMatchId = matchId;
        playerHeatmapToggles = {};
        
        const searchedPlayer = matchData[matchId].participants.find(p => p.puuid === currentPuuid);
        const searchedId = searchedPlayer ? searchedPlayer.participantId : null;
        
        for (let pId = 1; pId <= 10; pId++) {
            playerHeatmapToggles[pId] = {
                kills: pId === searchedId,
                deaths: pId === searchedId
            };
        }
        
        renderSidebarPlayers(matchId);
        renderCanvas();
    }

    function renderSidebarPlayers(matchId) {
        const playerListDiv = document.getElementById('playerList');
        playerListDiv.innerHTML = '';
        
        const participants = matchData[matchId].participants;
        const blueTeam = participants.filter(p => p.teamId === 100);
        const redTeam = participants.filter(p => p.teamId === 200);
        
        const blueContainer = document.createElement('div');
        blueContainer.className = 'team-container team-blue';
        blueContainer.innerHTML = `<div class="team-title">Blue Team (Box 1)</div>`;
        
        const redContainer = document.createElement('div');
        redContainer.className = 'team-container team-red';
        redContainer.innerHTML = `<div class="team-title">Red Team (Box 2)</div>`;
        
        function createPlayerCard(p) {
            const riotId = p.riotIdGameName ? `${p.riotIdGameName}#${p.riotIdTagline}` : p.summonerName;
            const iconUrl = `https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/champion-icons/${p.championId}.png`;
            
            const divisor = Math.max(1, p.deaths);
            const rawKda = (p.kills + p.assists) / divisor;
            const decimalKda = rawKda.toFixed(2);
            
            let kdaColor = '#aaa';
            if (p.deaths > 0) {
                if (rawKda >= 4.0) kdaColor = '#e5c158'; 
                else if (rawKda >= 3.0) kdaColor = '#57ca85'; 
                else if (rawKda >= 2.0) kdaColor = '#e29b3f'; 
                else kdaColor = '#e25c5c'; 
            } else if (p.kills + p.assists > 0) {
                kdaColor = '#e5c158'; 
            }

            const card = document.createElement('div');
            card.className = 'player-card';
            
            const pId = p.participantId;
            const kChecked = playerHeatmapToggles[pId].kills ? 'checked' : '';
            const dChecked = playerHeatmapToggles[pId].deaths ? 'checked' : '';
            
            card.innerHTML = `
                <div class="player-header">
                    <img src="${iconUrl}" alt="Champ">
                    <div class="player-info">
                        <span class="player-name" title="${riotId}">${riotId}</span>
                        <span class="player-kda">
                            KDA: ${p.kills}/${p.deaths}/${p.assists}
                            <span class="player-decimal-kda" style="color: ${kdaColor}">(${decimalKda})</span>
                        </span>
                    </div>
                </div>
                <div class="player-casts" title="Spells Cast">
                    <span>Q: ${p.spell1Casts || 0}</span>
                    <span>W: ${p.spell2Casts || 0}</span>
                    <span>E: ${p.spell3Casts || 0}</span>
                    <span>R: ${p.spell4Casts || 0}</span>
                </div>
                <div class="player-toggles">
                    <label><input type="checkbox" ${kChecked} onchange="togglePlayerHeatmap(${pId}, 'kills', this.checked)"> K</label>
                    <label><input type="checkbox" ${dChecked} onchange="togglePlayerHeatmap(${pId}, 'deaths', this.checked)"> D</label>
                </div>
            `;
            return card;
        }
        
        blueTeam.forEach(p => blueContainer.appendChild(createPlayerCard(p)));
        redTeam.forEach(p => redContainer.appendChild(createPlayerCard(p)));
        
        playerListDiv.appendChild(blueContainer);
        playerListDiv.appendChild(redContainer);
    }

    function togglePlayerHeatmap(participantId, type, isChecked) {
        if (playerHeatmapToggles[participantId]) {
            playerHeatmapToggles[participantId][type] = isChecked;
            renderCanvas();
        }
    }

    function renderCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (activeDetailedMatchId) {
            const match = matchData[activeDetailedMatchId];
            if (!match) return;
            
            Object.keys(playerHeatmapToggles).forEach(pId => {
                const toggles = playerHeatmapToggles[pId];
                const events = match.playerEvents[pId];
                const participant = match.participants.find(p => p.participantId == pId);
                
                if (!events || !participant) return;
                
                // Color codes for borders
                const killBorder = 'rgba(0, 255, 0, 0.9)'; 
                const deathBorder = 'rgba(255, 0, 0, 0.9)';
                
                if (toggles.kills) {
                    events.kills.forEach(event => {
                        // Plot victim's champion icon for a kill event
                        const victim = match.participants.find(p => p.participantId === event.victimId);
                        const victimChampId = victim ? victim.championId : participant.championId;
                        drawChampionIcon(event.position.x, event.position.y, victimChampId, killBorder);
                    });
                }
                if (toggles.deaths) {
                    events.deaths.forEach(event => {
                        // Plot own champion icon for a death event
                        drawPoint(event.position.x, event.position.y);
                        drawChampionIcon(event.position.x, event.position.y, participant.championId, deathBorder);
                    });
                }
            });
        }
    }

    // Standard HTML5 Canvas Circular Image Renderer with Clipping Paths
    function drawChampionIcon(riotX, riotY, championId, borderColor) {
        const pixelX = (riotX / RIOT_MAP_MAX) * canvas.width;
        const pixelY = canvas.height - ((riotY / RIOT_MAP_MAX) * canvas.height);
        const radius = 12; // Diameter: 24px

        const img = new Image();
        img.src = `https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/champion-icons/${championId}.png`;
        
        img.onload = () => {
            ctx.save();
            ctx.beginPath();
            ctx.arc(pixelX, pixelY, radius, 0, Math.PI * 2, true);
            ctx.closePath();
            ctx.clip(); // Mask boundaries to force circular layout
            
            ctx.drawImage(img, pixelX - radius, pixelY - radius, radius * 2, radius * 2);
            ctx.restore();

            // Render high-intensity, color-coded team boundaries
            ctx.beginPath();
            ctx.arc(pixelX, pixelY, radius, 0, Math.PI * 2, true);
            ctx.strokeStyle = borderColor;
            ctx.lineWidth = 2.5;
            ctx.stroke();
        };
    }
</script>

</body>
</html>
